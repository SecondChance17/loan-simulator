<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>住宅ローン変動権利チェックシート＆ローン計算</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .header {
            display: flex;
            align-items: center;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header img {
            max-height: 60px;
            margin-right: 15px;
        }
        h1 {
            font-size: 22px;
            color: #0056b3;
            margin: 0;
        }
        .section-title {
            font-size: 18px;
            color: #2c3e50;
            border-left: 4px solid #0056b3;
            padding-left: 10px;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #444;
        }
        .note {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }
        input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input::placeholder {
            color: #aaa;
        }
        .checkbox-group {
            background: #fafafa;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            font-weight: normal;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .checkbox-label input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
        }
        .btn {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #004085;
        }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            background: #eef9ff;
            border: 1px solid #b8daff;
            border-radius: 4px;
            display: none;
        }
        .result-box h3 {
            margin-top: 0;
            color: #004085;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ヘッダー（ロゴとタイトル） -->
    <div class="header">
        <img src="logo.jpg" alt="ロゴ">
        <h1>住宅ローン変動権利チェックシート＆ローン計算</h1>
    </div>

    <form id="loanForm">
        <!-- セクション1：ローン情報入力 -->
        <div class="section-title">1. 現在のローン情報入力</div>
        
        <div class="form-group">
            <label for="currentBalance">現在のローン残高</label>
            <input type="number" id="currentBalance" placeholder="例：現在のローン残高を入力してください">
        </div>

        <div class="form-group">
            <label for="remainingYears">残り返済期間（年）</label>
            <input type="number" id="remainingYears" placeholder="例：残り年数を入力してください">
        </div>

        <div class="form-group">
            <label for="currentRate">現在の適用金利（％）</label>
            <input type="number" step="0.01" id="currentRate" placeholder="例：0.5">
        </div>

        <!-- セクション2：チェックシート -->
        <div class="section-title">2. 変動権利・状況チェック</div>
        <div class="form-group checkbox-group">
            <p class="note">※下の「□」をクリックして、当てはまる項目にチェックしてください。</p>
            
            <label class="checkbox-label">
                <input type="checkbox" name="checkItem"> 金利上昇リスクについての説明を受けたことがある
            </label>
            <label class="checkbox-label">
                <input type="checkbox" name="checkItem"> 5年ルールや125%ルールについて理解している
            </label>
            <label class="checkbox-label">
                <input type="checkbox" name="checkItem"> 金利が1%上がっても家計に余裕がある
            </label>
            <label class="checkbox-label">
                <input type="checkbox" name="checkItem"> 固定金利への借り換えを検討したことがある
            </label>
        </div>

        <button type="button" class="btn" onclick="calculateLoan()">診断・計算する</button>
    </form>

    <!-- 結果表示エリア -->
    <div id="resultBox" class="result-box">
        <h3>診断結果</h3>
        <p id="resultText"></p>
    </div>
</div>

<script>
    function calculateLoan() {
        const balance = document.getElementById('currentBalance').value;
        const years = document.getElementById('remainingYears').value;
        const rate = document.getElementById('currentRate').value;
        
        const resultBox = document.getElementById('resultBox');
        const resultText = document.getElementById('resultText');

        if(!balance || !years || !rate) {
            alert('すべての項目を入力してください。');
            return;
        }

        // 簡単な簡易計算・表示の例
        resultBox.style.display = 'block';
        resultText.innerHTML = `ご入力ありがとうございます。<br>
        残高: <strong>${Number(balance).toLocaleString()}円</strong> / 残り期間: <strong>${years}年</strong> / 金利: <strong>${rate}%</strong><br>
        現在の状況をもとに、変動金利の見直しやリスク対策を検討することをお勧めします。`;
    }
</script>

</body>
</html>
